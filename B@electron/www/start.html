<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Blockly@rduino</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.BlocklyArduino.css"/>
    <link rel="stylesheet" type="text/css" href="css/blockly@rduino.css"/>
    <link rel="stylesheet" type="text/css" href="css/font-awesome.min.css"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f5f5f5;
            font-family: "Trebuchet MS", Arial, sans-serif;
        }
        #start-root {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #start-card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 24px 28px;
            max-width: 420px;
            width: 92%;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            color: #333333;
            border: 1px solid #e2e2e2;
        }
        #start-logo {
            font-size: 22px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        #start-logo .fa {
            margin-right: 6px;
            color: #4285f4;
        }
        #start-subtitle {
            font-size: 13px;
            color: #666666;
            margin-bottom: 20px;
        }
        #start-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        @media (min-width: 480px) {
            #start-buttons {
                flex-direction: row;
                justify-content: center;
            }
        }
        #btn_start_new_project,
        #btn_start_open_project {
            min-width: 170px;
            font-weight: 500;
            box-shadow: none;
        }
        #btn_start_new_project {
            background-color: #4285f4;
            border-color: #4285f4;
        }
        #btn_start_open_project {
            background-color: #ffffff;
            color: #4285f4;
            border-color: #d0d0d0;
        }
        #start-recent {
            margin-top: 22px;
            padding-top: 10px;
            border-top: 1px solid #eeeeee;
            text-align: left;
            font-size: 13px;
            color: #555555;
        }
        #start-recent-title {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #888888;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #start-recent-title .fa {
            font-size: 12px;
            color: #4285f4;
        }
        #start-recent-list {
            list-style: none;
            padding: 0;
            margin: 4px 0 0 0;
        }
        #start-recent-list li {
            margin: 0;
        }
        #start-recent-list a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            margin-top: 2px;
            border-radius: 4px;
            color: #333333;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }
        #start-recent-list a .start-recent-icon {
            color: #4285f4;
        }
        #start-recent-list a .start-recent-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #start-recent-list a:hover {
            background-color: #f3f6ff;
            border-color: #d4e0ff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div id="start-root">
        <div id="start-card">
            <div id="start-logo">
                <span class="fa fa-microchip"></span>
                Blockly@rduino
            </div>
            <div id="start-subtitle">
                Escolha como deseja começar seu projeto.
            </div>
            <div id="start-buttons">
                <button id="btn_start_new_project" class="btn btn-primary btn-lg">
                    Criar novo projeto
                </button>
                <button id="btn_start_open_project" class="btn btn-default btn-lg">
                    Carregar projeto existente
                </button>
            </div>
            <div id="start-recent" style="display:none;">
                <div id="start-recent-title">
                    <span class="fa fa-history"></span>
                    <span>Projetos recentes</span>
                </div>
                <ul id="start-recent-list"></ul>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            function goToMain(autoOpen) {
                try {
                    if (window.sessionStorage) {
                        window.sessionStorage.blocklyStartScreenDone = '1';
                    }
                } catch (e) {}

                var search = window.location.search || '';
                // Mantemos apenas os parâmetros já existentes; o
                // carregamento de projeto, quando houver, é feito
                // antes da navegação.
                window.location = 'index_electron.html' + search;
            }

            // Fluxo específico para "Carregar projeto existente" na
            // tela inicial: abre o diálogo nativo aqui mesmo. Só
            // depois que o usuário escolhe o arquivo é que vamos
            // para a tela principal do editor.
            function openExistingProjectFromStart() {
                var btnNew = document.getElementById('btn_start_new_project');
                var btnOpen = document.getElementById('btn_start_open_project');

                // Tenta obter ipcRenderer do Electron; se não
                // estiver disponível (modo web), volta para o
                // comportamento antigo.
                var ipcRenderer = null;
                try {
                    if (typeof require === 'function') {
                        var electron = require('electron');
                        ipcRenderer = electron && electron.ipcRenderer ? electron.ipcRenderer : null;
                    }
                } catch (e) {
                    ipcRenderer = null;
                }

                if (!ipcRenderer) {
                    goToMain(true);
                    return;
                }

                // Feedback rápido: desabilita botões enquanto o
                // diálogo de arquivo está aberto.
                if (btnNew) btnNew.disabled = true;
                if (btnOpen) btnOpen.disabled = true;

                ipcRenderer.invoke('blockly-open-project').then(function (result) {
                    if (!result || result.canceled || !result.filePath || !result.content || result.error) {
                        // Usuário cancelou ou houve erro: permanece
                        // na tela inicial, apenas reabilita os botões.
                        if (btnNew) btnNew.disabled = false;
                        if (btnOpen) btnOpen.disabled = false;
                        return;
                    }

                    // Guarda o XML do projeto para ser restaurado
                    // automaticamente quando o editor abrir.
                    try {
                        if (window.localStorage) {
                            window.localStorage.loadOnceBlocks = result.content;
                        }
                    } catch (e) {}

                    // Atualiza nome/caminho lógico do projeto, para
                    // título da janela e fluxos de salvar.
                    try {
                        var projectName = result.filePath;
                        try {
                            var pathModule = require('path');
                            if (pathModule && typeof pathModule.basename === 'function') {
                                projectName = pathModule.basename(result.filePath);
                            }
                        } catch (e) {}

                        if (window.localStorage) {
                            window.localStorage.currentProjectName = projectName;
                        }
                        if (window.sessionStorage) {
                            window.sessionStorage.currentProjectName = projectName || '';
                            window.sessionStorage.currentProjectPath = result.filePath || '';
                        }
                    } catch (e) {}

                    // Marca que o usuário já passou pela tela
                    // inicial nesta sessão.
                    try {
                        if (window.sessionStorage) {
                            window.sessionStorage.blocklyStartScreenDone = '1';
                        }
                    } catch (e) {}

                    // Agora sim vamos para o editor; ele vai ler o
                    // conteúdo salvo em localStorage.loadOnceBlocks.
                    goToMain(false);
                }).catch(function () {
                    if (btnNew) btnNew.disabled = false;
                    if (btnOpen) btnOpen.disabled = false;
                });
            }

            function openRecentProjectFromStart(filePath) {
                if (!filePath) return;
                var btnNew = document.getElementById('btn_start_new_project');
                var btnOpen = document.getElementById('btn_start_open_project');

                var ipcRenderer = null;
                try {
                    if (typeof require === 'function') {
                        var electron = require('electron');
                        ipcRenderer = electron && electron.ipcRenderer ? electron.ipcRenderer : null;
                    }
                } catch (e) {
                    ipcRenderer = null;
                }

                if (!ipcRenderer) {
                    return;
                }

                if (btnNew) btnNew.disabled = true;
                if (btnOpen) btnOpen.disabled = true;

                ipcRenderer.invoke('blockly-open-recent-project', { filePath: filePath }).then(function (result) {
                    if (!result || result.canceled || !result.filePath || !result.content || result.error) {
                        // Se o arquivo tiver sido removido do disco,
                        // avisamos o usuário antes de atualizar a lista.
                        try {
                            if (result && result.error === 'NOT_FOUND') {
                                alert('O arquivo deste projeto não foi encontrado.\nEle foi removido da lista de projetos recentes.');
                            }
                        } catch (e) {}
                        if (btnNew) btnNew.disabled = false;
                        if (btnOpen) btnOpen.disabled = false;
                        // Se o arquivo tiver sumido, pedimos a lista
                        // novamente para limpar a entrada inválida.
                        try {
                            loadRecentProjectsOnStart();
                        } catch (e) {}
                        return;
                    }

                    try {
                        if (window.localStorage) {
                            window.localStorage.loadOnceBlocks = result.content;
                        }
                    } catch (e) {}

                    try {
                        var projectName = result.filePath;
                        try {
                            var pathModule = require('path');
                            if (pathModule && typeof pathModule.basename === 'function') {
                                projectName = pathModule.basename(result.filePath);
                            }
                        } catch (e) {}

                        if (window.localStorage) {
                            window.localStorage.currentProjectName = projectName;
                        }
                        if (window.sessionStorage) {
                            window.sessionStorage.currentProjectName = projectName || '';
                            window.sessionStorage.currentProjectPath = result.filePath || '';
                        }
                    } catch (e) {}

                    try {
                        if (window.sessionStorage) {
                            window.sessionStorage.blocklyStartScreenDone = '1';
                        }
                    } catch (e) {}

                    goToMain(false);
                }).catch(function () {
                    if (btnNew) btnNew.disabled = false;
                    if (btnOpen) btnOpen.disabled = false;
                });
            }

            function loadRecentProjectsOnStart() {
                var recentContainer = document.getElementById('start-recent');
                var recentList = document.getElementById('start-recent-list');
                if (!recentContainer || !recentList) {
                    return;
                }

                var ipcRenderer = null;
                try {
                    if (typeof require === 'function') {
                        var electron = require('electron');
                        ipcRenderer = electron && electron.ipcRenderer ? electron.ipcRenderer : null;
                    }
                } catch (e) {
                    ipcRenderer = null;
                }

                if (!ipcRenderer) {
                    recentContainer.style.display = 'none';
                    return;
                }

                ipcRenderer.invoke('blockly-get-recent-projects').then(function (result) {
                    try {
                        var list = (result && Array.isArray(result.paths)) ? result.paths : [];
                        recentList.innerHTML = '';
                        if (!list.length) {
                            recentContainer.style.display = 'none';
                            return;
                        }
                        recentContainer.style.display = 'block';

                        var pathModule = null;
                        try {
                            pathModule = require('path');
                        } catch (e) {}

                        list.slice(0, 5).forEach(function (p) {
                            var name = p;
                            if (pathModule && typeof pathModule.basename === 'function') {
                                name = pathModule.basename(p);
                            }
                            var li = document.createElement('li');
                            var a = document.createElement('a');
                            a.href = '#';
                            a.title = p;

                            var icon = document.createElement('span');
                            icon.className = 'fa fa-file-code-o start-recent-icon';

                            var label = document.createElement('span');
                            label.className = 'start-recent-label';
                            label.textContent = name;

                            a.appendChild(icon);
                            a.appendChild(label);
                            a.addEventListener('click', function (ev) {
                                ev.preventDefault();
                                openRecentProjectFromStart(p);
                            });
                            li.appendChild(a);
                            recentList.appendChild(li);
                        });
                    } catch (e) {}
                }).catch(function () {
                    recentContainer.style.display = 'none';
                });
            }

            function init() {
                try {
                    if (window.sessionStorage &&
                        window.sessionStorage.blocklyStartScreenDone === '1') {
                        // Usuário já escolheu nesta sessão: vai direto para o app
                        goToMain(false);
                        return;
                    }
                } catch (e) {}

                var btnNew = document.getElementById('btn_start_new_project');
                var btnOpen = document.getElementById('btn_start_open_project');
                if (!btnNew || !btnOpen) {
                    return;
                }
                btnNew.addEventListener('click', function () {
                    goToMain(false);
                });
                btnOpen.addEventListener('click', function () {
					openExistingProjectFromStart();
                });

                // Carrega a lista de projetos recentes para exibir
                // logo na tela inicial.
                loadRecentProjectsOnStart();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
